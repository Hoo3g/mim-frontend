server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 'ok';
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # PDF.js worker is loaded as an ES module, so .mjs must be served as JavaScript MIME.
    location ~* \.mjs$ {
        default_type application/javascript;
        try_files $uri =404;
    }
}

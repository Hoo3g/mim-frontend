name: Frontend Publish Image

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  workflow_dispatch:

env:
  DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME || vars.DOCKERHUB_USERNAME }}
  DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN || vars.DOCKERHUB_TOKEN }}
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME || vars.DOCKERHUB_USERNAME }}/mim-frontend

jobs:
  publish-staging:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Docker Hub credentials
        run: |
          if [ -z "${DOCKERHUB_USERNAME}" ] || [ -z "${DOCKERHUB_TOKEN}" ]; then
            echo "::error::Missing DOCKERHUB_USERNAME or DOCKERHUB_TOKEN (secret/variable) in this repository."
            exit 1
          fi

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      - name: Build and push staging image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:staging-${{ github.sha }}
            ${{ env.IMAGE_NAME }}:staging-latest

      - name: Validate infra dispatch configuration
        run: |
          if [ -z "${{ secrets.INFRA_REPO }}" ] || [ -z "${{ secrets.INFRA_REPO_TOKEN }}" ]; then
            echo "::error::Missing INFRA_REPO or INFRA_REPO_TOKEN secret. Staging image was built, but auto deploy dispatch cannot run."
            exit 1
          fi

      - name: Notify infra repo for staging deploy
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.INFRA_REPO_TOKEN }}
          repository: ${{ secrets.INFRA_REPO }}
          event-type: frontend-image-published
          client-payload: >-
            {"environment":"staging","service":"frontend","image":"${{ env.IMAGE_NAME }}","tag":"staging-${{ github.sha }}","sha":"${{ github.sha }}"}

  publish-production:
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Docker Hub credentials
        run: |
          if [ -z "${DOCKERHUB_USERNAME}" ] || [ -z "${DOCKERHUB_TOKEN}" ]; then
            echo "::error::Missing DOCKERHUB_USERNAME or DOCKERHUB_TOKEN (secret/variable) in this repository."
            exit 1
          fi

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      - name: Prepare production tags
        id: prod-tags
        run: |
          set -euo pipefail
          TAGS="${IMAGE_NAME}:prod-${GITHUB_SHA}"
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAGS="${TAGS}"$'\n'"${IMAGE_NAME}:prod-${GITHUB_REF_NAME}"
          fi
          {
            echo "tags<<EOF"
            echo "${TAGS}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push production image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.prod-tags.outputs.tags }}

      - name: Validate infra dispatch configuration
        run: |
          if [ -z "${{ secrets.INFRA_REPO }}" ] || [ -z "${{ secrets.INFRA_REPO_TOKEN }}" ]; then
            echo "::error::Missing INFRA_REPO or INFRA_REPO_TOKEN secret. Production image was built, but auto deploy dispatch cannot run."
            exit 1
          fi

      - name: Notify infra repo for production deploy
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.INFRA_REPO_TOKEN }}
          repository: ${{ secrets.INFRA_REPO }}
          event-type: frontend-production-image-published
          client-payload: >-
            {"environment":"production","service":"frontend","image":"${{ env.IMAGE_NAME }}","tag":"prod-${{ github.sha }}","sha":"${{ github.sha }}"}
